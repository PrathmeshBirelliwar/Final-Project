<!DOCTYPE html>
<html lang="en">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Smart Library Management </title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <!-- Custom Theme CSS -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-card {
            width: 440px;
            padding: 40px;
        }

        .logo {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo i {
            font-size: 42px;
            color: var(--primary-color);
        }

        .logo h1 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-main);
            margin-top: 8px;
        }

        .input-group {
            position: relative;
            margin-top: 16px;
        }

        .input-group input {
            padding-left: 44px !important;
        }

        .left-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 16px;
            z-index: 5;
        }

        .toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            cursor: pointer;
            z-index: 5;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 16px 0;
            font-size: 13px;
        }

        .options a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }

        .login-btn {
            width: 100%;
            background: var(--primary-color) !important;
            color: #ffffff !important;
            border-radius: var(--radius-md) !important;
            padding: 12px !important;
            font-weight: 600 !important;
            font-size: 15px !important;
            margin-top: 12px;
        }

        .login-btn:hover {
            background: var(--primary-hover) !important;
        }

        .footer {
            margin-top: 24px;
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(4px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 32px;
            width: 440px;
            max-width: 90%;
            position: relative;
            box-shadow: var(--shadow-lg);
        }

        .modal-close {
            position: absolute;
            right: 20px;
            top: 18px;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-muted);
        }

        #error {
            color: #ef4444;
            font-size: 13px;
            margin-top: 12px;
            text-align: center;
        }
    </style>
</head>

<body>

       
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>

    <div class="login-card">

        <div class="logo">

            <i class="bi bi-book-half"></i>

            <h1>Admin Login</h1>

            <p>Smart Library Management System</p>

        </div>

        <form id="loginForm">

            <div class="input-group">

                <i class="bi bi-person-fill left-icon"></i>

                <input type="text" id="username" placeholder="Admin Username" required>

            </div>

            <div class="input-group">

                <i class="bi bi-lock-fill left-icon"></i>

                <input type="password" id="password" placeholder="Password" required>

                <i class="bi bi-eye-fill toggle" id="togglePassword"></i>

            </div>

            <div class="options">

               <label class="remember-me">
                <input type="checkbox" id="rememberMe">
                <span>Remember Me</span>
                </label>

                
                <a id="forgotPasswordLink">Forgot Password?</a>

            </div>

            <button class="login-btn">

                <i class="bi bi-box-arrow-in-right"></i>

                Login

            </button>

            <div id="error"></div>

        </form>

        <div class="footer">

            © 2026 Smart Library Management System

        </div>

    </div>

    <!-- Forgot Password Modal -->
    <div class="modal-overlay" id="forgotModal">
        <div class="modal-card">
            <span class="modal-close" id="closeForgotModal">&times;</span>
            <h2><i class="bi bi-key-fill me-2"></i> Forgot Password</h2>
            <p>Enter your registered email address to receive a secure password reset token.</p>

            <div id="step1">
                <div class="input-group" style="margin-top: 0;">
                    <i class="bi bi-envelope-fill left-icon"></i>
                    <input type="email" id="resetEmail" placeholder="Registered Email Address"
                        style="background: rgba(255,255,255,0.1);">
                </div>
                <button type="button" class="login-btn" id="btnRequestReset" style="margin-top: 20px;">Send Reset
                    Token</button>
            </div>

            <div id="step2" style="display: none;">
                <div class="input-group" style="margin-top: 0;">
                    <i class="bi bi-shield-lock-fill left-icon"></i>
                    <input type="text" id="resetTokenInput" placeholder="Enter Reset Token"
                        style="background: rgba(255,255,255,0.1);">
                </div>
                <div class="input-group" style="margin-top: 15px;">
                    <i class="bi bi-lock-fill left-icon"></i>
                    <input type="password" id="newPasswordInput" placeholder="Enter New Password"
                        style="background: rgba(255,255,255,0.1);">
                </div>
                <button type="button" class="login-btn" id="btnConfirmReset" style="margin-top: 20px;">Reset
                    Password</button>
            </div>

            <div id="resetMsg" class="msg-box"></div>
        </div>
    </div>

    
    <script src="js/config.js"></script>
    <script src="js/db.js"></script>
    <script>

        // Show Password Toggle

        const password = document.getElementById("password");
        const toggle = document.getElementById("togglePassword");

        toggle.onclick = function () {

            if (password.type === "password") {

                password.type = "text";
                toggle.classList.replace("bi-eye-fill", "bi-eye-slash-fill");

            }

            else {

                password.type = "password";
                toggle.classList.replace("bi-eye-slash-fill", "bi-eye-fill");

            }

        };

        // Login Validation via DB API
        document.getElementById("loginForm").addEventListener("submit", async function (e) {

            e.preventDefault();

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value.trim();
            const error = document.getElementById("error");

            error.innerHTML = "";

            const res = await window.DB.login(username, password);

            if (res.success) {

                window.location.href = "admin_page.html";

            }

            else {

                error.innerHTML = res.message || "Invalid Username or Password";

            }

        });

        // Forgot Password Flow
        const forgotLink = document.getElementById("forgotPasswordLink");
        const forgotModal = document.getElementById("forgotModal");
        const closeForgotModal = document.getElementById("closeForgotModal");
        const btnRequestReset = document.getElementById("btnRequestReset");
        const btnConfirmReset = document.getElementById("btnConfirmReset");
        const resetMsg = document.getElementById("resetMsg");

        forgotLink.onclick = function () {
            forgotModal.style.display = "flex";
            document.getElementById("step1").style.display = "block";
            document.getElementById("step2").style.display = "none";
            resetMsg.style.display = "none";
        };

        closeForgotModal.onclick = function () {
            forgotModal.style.display = "none";
        };

        window.onclick = function (e) {
            if (e.target === forgotModal) {
                forgotModal.style.display = "none";
            }
        };

        btnRequestReset.onclick = async function () {
            const email = document.getElementById("resetEmail").value.trim();
            resetMsg.style.display = "none";

            const res = await window.DB.requestPasswordReset(email);

            resetMsg.style.display = "block";
            if (res.success) {
                resetMsg.className = "msg-box msg-success";
                let msgText = res.message;
                if (res.demoToken) {
                    msgText += `<br><strong>Reset Token: ${res.demoToken}</strong> (Sent to email)`;
                }
                resetMsg.innerHTML = msgText;
                document.getElementById("step1").style.display = "none";
                document.getElementById("step2").style.display = "block";
            } else {
                resetMsg.className = "msg-box msg-danger";
                resetMsg.innerHTML = res.message;
            }
        };

        btnConfirmReset.onclick = async function () {
            const email = document.getElementById("resetEmail").value.trim();
            const token = document.getElementById("resetTokenInput").value.trim();
            const newPass = document.getElementById("newPasswordInput").value.trim();

            resetMsg.style.display = "none";

            const res = await window.DB.resetPassword(email, token, newPass);

            resetMsg.style.display = "block";
            if (res.success) {
                resetMsg.className = "msg-box msg-success";
                resetMsg.innerHTML = res.message;
                setTimeout(() => {
                    forgotModal.style.display = "none";
                }, 2500);
            } else {
                resetMsg.className = "msg-box msg-danger";
                resetMsg.innerHTML = res.message;
            }
        };

    </script>

</body>

</html>
