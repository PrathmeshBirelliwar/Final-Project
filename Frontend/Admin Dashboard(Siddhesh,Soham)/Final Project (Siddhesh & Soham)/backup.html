<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Backup Database</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<link rel="stylesheet" href="css/style.css">

<script src="js/db.js"></script>
<script src="js/auth.js"></script>
</head>

<body>

<div class="sidebar">

<h3>Library Admin</h3>

<a href="admin_page.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
<a href="manage_librarians.html"><i class="bi bi-person-workspace"></i> Manage Librarians</a>
<a href="manage_books.html"><i class="bi bi-book"></i> Manage Books</a>
<a href="manage_members.html"><i class="bi bi-people"></i> Manage Members</a>
<a href="reports.html"><i class="bi bi-file-earmark-bar-graph"></i> Reports</a>
<a href="fine_collection.html"><i class="bi bi-cash-stack"></i> Fine Collection</a>
<a href="backup.html"><i class="bi bi-database"></i> Backup Database</a>
<a href="logout.html"><i class="bi bi-box-arrow-right"></i> Logout</a>

</div>

<div class="content">

<h2>Backup Database</h2>

<div class="card p-4 mt-4">

<h4>Database Information</h4>

<table class="table table-bordered mt-3">

<tr>
<th>Database Name</th>
<td>smart_library</td>
</tr>

<tr>
<th>Total Tables</th>
<td>6</td>
</tr>

<tr>
<th>Last Backup</th>
<td id="lastBackup">None</td>
</tr>

<tr>
<th>Status</th>
<td><span class="badge bg-success">Ready</span></td>
</tr>

</table>

<div class="mt-4">

<button class="btn btn-primary btn-lg" onclick="backupDatabase()">
<i class="bi bi-download"></i>
Backup Database
</button>

<button class="btn btn-success btn-lg" onclick="restoreDatabase()">
<i class="bi bi-arrow-clockwise"></i>
Restore Backup
</button>

<input type="file" id="restoreFile" accept=".sql" hidden onchange="restoreSelectedFile(event)">

</div>

</div>

<div class="card p-4 mt-4">

<h4>Backup History</h4>

<table class="table table-striped table-bordered mt-3">

<thead class="table-dark">

<tr>
<th>Date</th>
<th>Backup File</th>
<th>Size</th>
<th>Status</th>
</tr>

</thead>

<tbody id="historyTable">
</tbody>

</table>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

function renderBackupHistory() {
    const history = window.DB.getBackups();
    const historyTable = document.getElementById("historyTable");
    
    // Clear container first to prevent duplicates (BUG_07 fix)
    historyTable.innerHTML = "";

    if (history.length === 0) {
        historyTable.innerHTML = `<tr><td colspan="4" class="text-center text-muted">No backup history available.</td></tr>`;
        document.getElementById("lastBackup").innerText = "None";
        return;
    }

    document.getElementById("lastBackup").innerText = history[0].date;

    history.forEach(item => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${item.date}</td>
            <td>${item.fileName}</td>
            <td>${item.size || '3.0 MB'}</td>
            <td><span class="badge bg-success">${item.status || 'Completed'}</span></td>
        `;
        historyTable.appendChild(tr);
    });
}

function backupDatabase(){

    let now = new Date();

    let day = String(now.getDate()).padStart(2,'0');
    let month = String(now.getMonth()+1).padStart(2,'0');
    let year = now.getFullYear();

    let fileName = "library_backup_"+day+"_"+month+"_"+year+".sql";

    const books = window.DB.getBooks();
    const members = window.DB.getMembers();
    const librarians = window.DB.getLibrarians();
    const fines = window.DB.getFines();

    let backupContent =
`-- Smart Library Management System Backup
-- Generated on: ${now.toLocaleString()}

CREATE DATABASE smart_library;

-- BOOKS SCHEMA & DATA
-- JSON_DATA: ${JSON.stringify(books)}

-- MEMBERS SCHEMA & DATA
-- JSON_DATA: ${JSON.stringify(members)}

-- LIBRARIANS SCHEMA & DATA
-- JSON_DATA: ${JSON.stringify(librarians)}

-- FINES SCHEMA & DATA
-- JSON_DATA: ${JSON.stringify(fines)}
`;

    let blob = new Blob([backupContent],{type:"text/plain"});

    let link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = fileName;
    link.click();

    // Store single backup record in DB engine
    window.DB.addBackupRecord(fileName, "3.2 MB");

    renderBackupHistory();

    alert("Database Backup Created Successfully!");

}

function restoreDatabase(){
    document.getElementById("restoreFile").click();
}

function restoreSelectedFile(e){

    const file = e.target.files[0];
    if(!file) return;

    // Validate Extension (BUG_08)
    if (!file.name.toLowerCase().endsWith(".sql")) {
        alert("Invalid file format! Please upload a valid SQL file (.sql).");
        e.target.value = "";
        return;
    }

    // Validate Size
    if (file.size === 0) {
        alert("The selected file is empty. Please upload a valid system backup.");
        e.target.value = "";
        return;
    }

    const reader = new FileReader();
    reader.onload = function(event) {
        const content = event.target.result;

        // Validation against invalid SQL files (BUG_08)
        const check = window.DB.restoreBackup(content, file.name);
        if (!check.success) {
            alert(check.message);
            e.target.value = "";
            return;
        }

        // Confirmation before overwrite
        const confirmRestore = confirm(`WARNING: Restoring a backup will overwrite current system data.\n\nBackup File: ${file.name}\n\nDo you want to continue?`);

        if (!confirmRestore) {
            e.target.value = "";
            return;
        }

        // Add backup record & refresh history
        window.DB.addBackupRecord(file.name + " (Restored)", (file.size / 1024 / 1024).toFixed(1) + " MB");
        renderBackupHistory();

        alert(`Database Restored Successfully!\n\nBackup File: ${file.name}`);
        e.target.value = "";
    };

    reader.readAsText(file);
}

document.addEventListener("DOMContentLoaded", renderBackupHistory);

</script>

</body>
</html>
