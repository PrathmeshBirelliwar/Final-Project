<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Backup Database</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<link rel="stylesheet" href="css/style.css">

<script src="js/db.js"></script>
<script src="js/auth.js"></script>
</head>

<body>

<div class="sidebar">

<h3>Library Admin</h3>

<a href="admin_page.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
<a href="manage_librarians.html"><i class="bi bi-person-workspace"></i> Manage Librarians</a>
<a href="manage_books.html"><i class="bi bi-book"></i> Manage Books</a>
<a href="manage_members.html"><i class="bi bi-people"></i> Manage Members</a>
<a href="reports.html"><i class="bi bi-file-earmark-bar-graph"></i> Reports</a>
<a href="fine_collection.html"><i class="bi bi-cash-stack"></i> Fine Collection</a>
<a href="backup.html"><i class="bi bi-database"></i> Backup Database</a>
<a href="logout.html"><i class="bi bi-box-arrow-right"></i> Logout</a>

</div>

<div class="content">

<h2>Backup Database</h2>

<div class="card p-4 mt-4">

<h4>Database Information</h4>

<table class="table table-bordered mt-3">

<tr>
<th>Database Name</th>
<td id="dbName">Loading...</td>
</tr>

<tr>
<th>Total Tables</th>
<td id="dbTableCount">Loading...</td>
</tr>

<tr>
<th>Last Backup</th>
<td id="lastBackup">None</td>
</tr>

<tr>
<th>Status</th>
<td><span class="badge bg-success" id="dbStatusBadge">Connected</span></td>
</tr>

</table>

<div class="mt-4">

<button class="btn btn-primary btn-lg" onclick="backupDatabase()">
<i class="bi bi-download"></i>
Backup Database
</button>

<button class="btn btn-success btn-lg" onclick="restoreDatabase()">
<i class="bi bi-arrow-clockwise"></i>
Restore Backup
</button>

<input type="file" id="restoreFile" accept=".sql" hidden onchange="restoreSelectedFile(event)">

</div>

</div>

<div class="card p-4 mt-4">

<h4>Backup History</h4>

<table class="table table-striped table-bordered mt-3">

<thead class="table-dark">

<tr>
<th>Date</th>
<th>Backup File</th>
<th>Size</th>
<th>Status</th>
</tr>

</thead>

<tbody id="historyTable">
</tbody>

</table>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

async function renderDatabaseInfo() {
    const statusBadge = document.getElementById("dbStatusBadge");
    try {
        const health = await fetch((window.LIBRARY_API_BASE || "http://localhost:5000/api") + "/health").then(r => r.json());
        if (statusBadge) {
            statusBadge.textContent = health.success ? "Connected" : "Unreachable";
            statusBadge.className = "badge " + (health.success ? "bg-success" : "bg-danger");
        }
    } catch (_) {
        if (statusBadge) { statusBadge.textContent = "Unreachable"; statusBadge.className = "badge bg-danger"; }
    }

    await window.DB.ready();
    const stats = window.DB.getStats();
    document.getElementById("dbName").textContent = stats.databaseName || "library_hub";
    document.getElementById("dbTableCount").textContent = stats.tableCount ?? "-";
}

async function renderBackupHistory() {
    await window.DB.ready();
    const history = window.DB.getBackups();
    const historyTable = document.getElementById("historyTable");

    // Clear container first to prevent duplicates (BUG_07 fix)
    historyTable.innerHTML = "";

    if (history.length === 0) {
        historyTable.innerHTML = `<tr><td colspan="4" class="text-center text-muted">No backup history available.</td></tr>`;
        document.getElementById("lastBackup").innerText = "None";
        return;
    }

    document.getElementById("lastBackup").innerText = new Date(history[0].date).toLocaleString();

    history.forEach(item => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${new Date(item.date).toLocaleString()}</td>
            <td>${item.status === "Completed" ? `<a href="#" onclick="downloadBackup('${item.id}');return false;">${item.fileName}</a>` : item.fileName}</td>
            <td>${item.size || '0 KB'}</td>
            <td><span class="badge ${item.status === 'Completed' ? 'bg-success' : 'bg-danger'}">${item.status || 'Completed'}</span></td>
        `;
        historyTable.appendChild(tr);
    });
}

function downloadBackup(id) {
    // Downloading requires the JWT, so we fetch as a blob rather than a plain <a href>.
    const token = JSON.parse(sessionStorage.getItem("smart_library_session") || "null")?.token;
    fetch(window.DB.downloadBackupUrl(id), { headers: token ? { Authorization: "Bearer " + token } : {} })
        .then(res => res.ok ? res.blob() : Promise.reject(res))
        .then(blob => {
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "library_backup.sql";
            link.click();
        })
        .catch(() => alert("Could not download this backup file."));
}

async function backupDatabase(){
    const btn = event ? event.target.closest("button") : null;
    if (btn) { btn.disabled = true; btn.innerText = "Backing up..."; }

    const res = await window.DB.createBackup();

    if (btn) { btn.disabled = false; btn.innerHTML = `<i class="fa-solid fa-download me-1"></i> Backup Now`; }

    await renderBackupHistory();
    alert(res.message);
}

function restoreDatabase(){
    document.getElementById("restoreFile").click();
}

async function restoreSelectedFile(e){

    const file = e.target.files[0];
    if(!file) return;

    // Validate Extension (BUG_08)
    if (!file.name.toLowerCase().endsWith(".sql")) {
        alert("Invalid file format! Please upload a valid SQL file (.sql).");
        e.target.value = "";
        return;
    }

    // Validate Size
    if (file.size === 0) {
        alert("The selected file is empty. Please upload a valid system backup.");
        e.target.value = "";
        return;
    }

    const reader = new FileReader();
    reader.onload = async function(event) {
        const content = event.target.result;

        // Validation against invalid SQL files (BUG_08)
        const check = await window.DB.restoreBackup(content, file.name);

        // Confirmation before overwrite
        const confirmRestore = confirm(`WARNING: Restoring a backup will overwrite current system data.\n\nBackup File: ${file.name}\n\nDo you want to continue?`);

        if (!confirmRestore) {
            e.target.value = "";
            return;
        }

        alert(check.message);
        e.target.value = "";
    };

    reader.readAsText(file);
}

document.addEventListener("DOMContentLoaded", renderBackupHistory);
document.addEventListener("DOMContentLoaded", renderDatabaseInfo);

</script>

</body>
</html>
