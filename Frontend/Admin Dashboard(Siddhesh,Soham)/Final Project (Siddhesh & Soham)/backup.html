<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<link rel="stylesheet" href="css/style.css">


<script src="js/auth.js"></script>
</head>

<body>

<div class="sidebar">

<h3>Library Admin</h3>

<a href="admin_page.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
<a href="manage_librarians.html"><i class="bi bi-person-workspace"></i> Manage Librarians</a>

<a href="manage_members.html"><i class="bi bi-people"></i> Manage Members</a>

<a href="logout.html"><i class="bi bi-box-arrow-right"></i> Logout</a>

</div>

<div class="content">

<h2>Backup Database</h2>

<div class="card p-4 mt-4">

<h4>Database Information</h4>

<table class="table table-bordered mt-3">

<tr>
<th>Database Name</th>
<td>smart_library</td>
</tr>

<tr>
<th>Total Tables</th>
<td>6</td>
</tr>

<tr>
<th>Last Backup</th>
<td id="lastBackup">None</td>
</tr>

<tr>
<th>Status</th>
<td><span class="badge bg-success">Ready</span></td>
</tr>

</table>

<div class="mt-4">

<button class="btn btn-primary btn-lg" onclick="backupDatabase()">
<i class="bi bi-download"></i>
Backup Database
</button>

<button class="btn btn-success btn-lg" onclick="restoreDatabase()">
<i class="bi bi-arrow-clockwise"></i>
Restore Backup
</button>

<input type="file" id="restoreFile" accept=".sql" hidden onchange="restoreSelectedFile(event)">

</div>

</div>

<div class="card p-4 mt-4">

<h4>Backup History</h4>

<table class="table table-striped table-bordered mt-3">

<thead class="table-dark">

<tr>
<th>Date</th>
<th>Backup File</th>
<th>Size</th>
<th>Status</th>
</tr>

</thead>

<tbody id="historyTable">
</tbody>

</table>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const API = "http://localhost:5000/api/backups";

function getToken() {
    return sessionStorage.getItem("token");
}


async function renderBackupHistory() {

    try {

        const response = await fetch(API, {
            headers: {
                Authorization: `Bearer ${getToken()}`
            }
        });

        const data = await response.json();

        if (!data.success) {
            alert(data.message);
            return;
        }

        const historyTable = document.getElementById("historyTable");
        historyTable.innerHTML = "";

        if (data.backups.length === 0) {

            historyTable.innerHTML =
                `<tr><td colspan="4" class="text-center">No backup history available.</td></tr>`;

            document.getElementById("lastBackup").innerText = "None";

            return;

        }

        document.getElementById("lastBackup").innerText =
            new Date(data.backups[0].date).toLocaleString();

        data.backups.forEach(item => {

            historyTable.innerHTML += `

            <tr>

                <td>${new Date(item.date).toLocaleString()}</td>

                <td>

                    <a href="${API}/${item.id}/download"
                       target="_blank">

                        ${item.fileName}

                    </a>

                </td>

                <td>${item.size}</td>

                <td>

                    <span class="badge bg-success">

                        ${item.status}

                    </span>

                </td>

            </tr>

            `;

        });

    } catch(err){

        console.error(err);

        alert("Unable to load backups.");

    }

}

async function backupDatabase() {

    try {

        const response = await fetch(API, {

            method: "POST",

            headers: {
                Authorization: `Bearer ${getToken()}`
            }

        });

        const data = await response.json();

        alert(data.message);

        if (data.success) {

            renderBackupHistory();

        }

    } catch(err){

        console.error(err);

        alert("Unable to create backup.");

    }

}

function restoreDatabase() {
    alert("Restore feature is not available in the current backend.");
}


document.addEventListener("DOMContentLoaded", renderBackupHistory);

</script>

</body>
</html>
