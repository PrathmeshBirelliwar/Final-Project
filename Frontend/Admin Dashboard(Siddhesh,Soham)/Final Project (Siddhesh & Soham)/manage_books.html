<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Books</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<link rel="stylesheet" href="css/style.css">

<script src="js/auth.js"></script>
</head>
<header>
    <i class="bi bi-book"></i>
    Manage Books
</header>
<body>

<div class="sidebar">
<h3>Library Admin</h3>

<a href="admin_page.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
<a href="manage_librarians.html"><i class="bi bi-person-workspace"></i> Manage Librarians</a>
<a href="manage_books.html"><i class="bi bi-book"></i> Manage Books</a>
<a href="manage_members.html"><i class="bi bi-people"></i> Manage Members</a>
<a href="reports.html"><i class="bi bi-file-earmark-bar-graph"></i> Reports</a>
<a href="fine_collection.html"><i class="bi bi-cash-stack"></i> Fine Collection</a>
<a href="backup.html"><i class="bi bi-database"></i> Backup Database</a>
<a href="logout.html"><i class="bi bi-box-arrow-right"></i> Logout</a>
</div>

<div class="content">



<div class="card p-4 mt-3">

<div class="row">

<div class="col-md-6 mb-3">
<label>Book ID</label>
<input type="text" id="bookId" class="form-control">
</div>

<div class="col-md-6 mb-3">
<label>Book Name</label>
<input type="text" id="bookName" class="form-control">
</div>

<div class="col-md-6 mb-3">
<label>Author</label>
<input type="text" id="author" class="form-control">
</div>

<div class="col-md-6 mb-3">
<label>Category</label>
<input type="text" id="category" class="form-control">
</div>

<div class="col-md-6 mb-3">
<label>Publisher</label>
<input type="text" id="publisher" class="form-control">
</div>

<div class="col-md-6 mb-3">
<label>Quantity</label>
<input type="number" id="quantity" class="form-control" min="1" step="1">
</div>

</div>

<div class="book-btns">

    <button type="button"
            class="add"
            id="btnSaveBook"
            onclick="addBook()">
        Add Book
    </button>

    <button type="button"
            class="edit"
            onclick="updateBook()">
        Update
    </button>

    <button type="button"
            class="delete"
            onclick="deleteBook()">
        Delete
    </button>

</div>

<div class="card mt-4 p-4">

<div class="row mb-3">
<div class="col-md-4">
<input type="text" id="search" class="form-control" placeholder="Search Book..." onkeyup="searchBook()">
</div>
</div>

<table class="table table-bordered table-striped">

<thead class="table-dark">
<tr>
<th>Book ID</th>
<th>Book Name</th>
<th>Author</th>
<th>Category</th>
<th>Publisher</th>
<th>Quantity</th>
</tr>
</thead>

<tbody id="bookTable">
</tbody>

</table>

</div>

</div>

<!-- Delete Confirmation Modal -->
<div class="modal fade" id="deleteBookModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="border-radius: 20px; border: none; box-shadow: 0 20px 40px rgba(0,0,0,0.25);">
      <div class="modal-header bg-danger text-white" style="border-top-left-radius: 20px; border-top-right-radius: 20px;">
        <h5 class="modal-title fw-bold"><i class="bi bi-exclamation-triangle-fill me-2"></i> Confirm Book Deletion</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body text-center p-4">
        <i class="bi bi-trash text-danger" style="font-size: 50px;"></i>
        <h5 class="mt-3 text-dark fw-semibold" id="deleteBookMsg">Are you sure you want to delete this book?</h5>
        <p class="text-muted fs-6">This action cannot be undone.</p>
      </div>
      <div class="modal-footer justify-content-center border-0 pb-4">
        <button type="button" class="btn btn-secondary px-4 py-2" style="border-radius: 25px;" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-danger px-4 py-2" style="border-radius: 25px; border: none;" id="btnConfirmDeleteBook">Confirm Delete</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
const API = "http://localhost:5000/api/books";

function getToken() {
    return sessionStorage.getItem("token");
}

let selectedRow = null;
let selectedBookId = null;

async function renderBooks() {
    try {
        const response = await fetch(API, {
            headers: {
                Authorization: `Bearer ${getToken()}`
            }
        });

        const data = await response.json();

        if (!data.success) {
            alert(data.message);
            return;
        }

        const tableBody = document.getElementById("bookTable");
        tableBody.innerHTML = "";

        data.books.forEach(b => {
            const tr = document.createElement("tr");

            tr.onclick = () => selectRow(tr, b.id);

            tr.innerHTML = `
                <td>${b.id}</td>
                <td>${b.title}</td>
                <td>${b.author}</td>
                <td>${b.category}</td>
                <td>${b.publisher ?? ""}</td>
                <td>${b.totalCopies}</td>
            `;

            tableBody.appendChild(tr);
        });

    } catch (err) {
        console.error(err);
        alert("Unable to load books.");
    }
}

function selectRow(row, id){

if(selectedRow)
selectedRow.classList.remove("selected");

selectedRow=row;
selectedBookId=id;
row.classList.add("selected");

document.getElementById("bookId").value=row.cells[0].innerText;
document.getElementById("bookName").value=row.cells[1].innerText;
document.getElementById("author").value=row.cells[2].innerText;
document.getElementById("category").value=row.cells[3].innerText;
document.getElementById("publisher").value=row.cells[4].innerText;
document.getElementById("quantity").value=row.cells[5].innerText;

}

async function addBook() {

    const book = {
        id: document.getElementById("bookId").value,
        name: document.getElementById("bookName").value,
        author: document.getElementById("author").value,
        category: document.getElementById("category").value,
        publisher: document.getElementById("publisher").value,
        quantity: Number(document.getElementById("quantity").value)
    };

    try {

        const response = await fetch(API, {

            method: "POST",

            headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${getToken()}`
            },

            body: JSON.stringify(book)

        });

        const data = await response.json();

        alert(data.message);

        if (data.success) {

            clearForm();

            renderBooks();

        }

    } catch (err) {

        console.error(err);

        alert("Unable to add book.");

    }

}

async function updateBook() {

    if (selectedRow == null || !selectedBookId) {
        alert("Please select a book row to update");
        return;
    }

    const book = {
        id: document.getElementById("bookId").value,
        name: document.getElementById("bookName").value,
        author: document.getElementById("author").value,
        category: document.getElementById("category").value,
        publisher: document.getElementById("publisher").value,
        quantity: Number(document.getElementById("quantity").value)
    };

    try {

        const response = await fetch(API + "/" + selectedBookId, {
            method: "PUT",
            headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${getToken()}`
            },
            body: JSON.stringify(book)
        });

        const data = await response.json();

        alert(data.message);

        if (data.success) {
            clearForm();
            renderBooks();
        }

    } catch (err) {
        console.error(err);
        alert("Unable to update book.");
    }

}

async function deleteBook() {

    if (selectedRow == null || !selectedBookId) {
        alert("Please select a book row to delete");
        return;
    }

    if (!confirm("Are you sure you want to delete this book?")) {
        return;
    }

    try {

        const response = await fetch(API + "/" + selectedBookId, {
            method: "DELETE",
            headers: {
                Authorization: `Bearer ${getToken()}`
            }
        });

        const data = await response.json();

        alert(data.message);

        if (data.success) {
            clearForm();
            renderBooks();
        }

    } catch (err) {
        console.error(err);
        alert("Unable to delete book.");
    }

}

function clearForm(){

document.getElementById("bookId").value="";
document.getElementById("bookName").value="";
document.getElementById("author").value="";
document.getElementById("category").value="";
document.getElementById("publisher").value="";
document.getElementById("quantity").value="";

if(selectedRow) selectedRow.classList.remove("selected");
selectedRow = null;
selectedBookId = null;

}

function searchBook(){

let input=document.getElementById("search").value.toUpperCase();
let table=document.getElementById("bookTable");
let tr=table.getElementsByTagName("tr");

for(let i=0;i<tr.length;i++){

let found=false;
let td=tr[i].getElementsByTagName("td");

for(let j=0;j<td.length;j++){

if(td[j].innerText.toUpperCase().indexOf(input)>-1){
found=true;
}

}

tr[i].style.display=found?"":"none";

}

}

document.addEventListener("DOMContentLoaded", renderBooks);

</script>

</body>
</html>
