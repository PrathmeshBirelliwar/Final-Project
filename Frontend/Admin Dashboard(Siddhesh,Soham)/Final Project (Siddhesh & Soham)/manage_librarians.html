<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Librarians</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <!-- Custom Theme CSS -->
    <link rel="stylesheet" href="css/style.css">

    <script src="js/db.js"></script>
    <script src="js/auth.js"></script>
</head>

<header>
    <i class="bi bi-person-workspace"></i>
    Manage Librarians
</header>

<body>

    <div class="sidebar">
        <h3>Library Admin</h3>

        <a href="admin_page.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="manage_librarians.html"><i class="bi bi-person-workspace"></i> Manage Librarians</a>
        <a href="manage_books.html"><i class="bi bi-book"></i> Manage Books</a>
        <a href="manage_members.html"><i class="bi bi-people"></i> Manage Members</a>
        <a href="reports.html"><i class="bi bi-file-earmark-bar-graph"></i> Reports</a>
        <a href="fine_collection.html"><i class="bi bi-cash-stack"></i> Fine Collection</a>
        <a href="backup.html"><i class="bi bi-database"></i> Backup Database</a>
        <a href="logout.html"><i class="bi bi-box-arrow-right"></i> Logout</a>
    </div>

    <div class="container">

        <div class="card">

        

            <div class="form-grid">

                <input type="text" id="lid" placeholder="Librarian ID">
                <input type="text" id="name" placeholder="Full Name">

                <input type="email" id="email" placeholder="Email Address">
                <input type="text" id="phone" placeholder="Phone Number">

                <input type="text" id="address" placeholder="Address">
                <input type="password" id="password" placeholder="Password">

            </div>
                  <div class="form-grid">

    <!-- all inputs -->

</div>

<div class="btn-container">
    <button type="button"
            class="add"
            id="btnSaveLibrarian"
            onclick="saveLibrarian()">
        Add Librarian
    </button>
</div>

<input
    type="text"
    id="search"
    class="search"
    placeholder="Search by ID, Name, Email or Phone"
    onkeyup="searchLibrarian()">



            <table>

                <thead>

                    <tr>

                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Address</th>
                        <th>Action</th>

                    </tr>

                </thead>

                <tbody id="tableBody"></tbody>

            </table>

        </div>

    </div>

    <script>

        let editingLibrarianId = null;

        function displayLibrarians() {

            const librarians = window.DB.getLibrarians();
            const table = document.getElementById("tableBody");
            table.innerHTML = "";

            librarians.forEach(l => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
            <td>${l.id}</td>
            <td>${l.name}</td>
            <td>${l.email}</td>
            <td>${l.phone}</td>
            <td>${l.address}</td>
            <td>
                <button class="edit" onclick="editLibrarian('${l.id}')">Edit</button>
                <button class="delete" onclick="deleteLibrarian('${l.id}')">Delete</button>
            </td>
        `;
                table.appendChild(tr);
            });

        }

        async function saveLibrarian() {

            const id = document.getElementById("lid").value;
            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;
            const phone = document.getElementById("phone").value;
            const address = document.getElementById("address").value;
            const password = document.getElementById("password").value;

            let res;
            if (editingLibrarianId) {
                // Edit Mode: Password is optional during edit (BUG_12)
                res = await window.DB.updateLibrarian(editingLibrarianId, {
                    id,
                    name,
                    email,
                    phone,
                    address,
                    password
                });
            } else {
                // Add Mode: Unique Email & Phone Check (BUG_11)
                res = await window.DB.addLibrarian({
                    id,
                    name,
                    email,
                    phone,
                    address,
                    password
                });
            }

            if (!res.success) {
                alert(res.message);
                return;
            }

            displayLibrarians();
            clearForm();
            alert(res.message);

        }

        function editLibrarian(id) {

            const librarians = window.DB.getLibrarians();
            const l = librarians.find(item => item.id.toLowerCase() === id.toLowerCase());

            if (!l) return;

            editingLibrarianId = l.id;

            document.getElementById("lid").value = l.id;
            document.getElementById("name").value = l.name;
            document.getElementById("email").value = l.email;
            document.getElementById("phone").value = l.phone;
            document.getElementById("address").value = l.address;

            // NEVER expose existing password or password hash (BUG_12)
            document.getElementById("password").value = "";
            document.getElementById("password").placeholder = "Leave blank to keep existing password";

            document.getElementById("btnSaveLibrarian").innerText = "Update Librarian";

            window.scrollTo({ top: 0, behavior: "smooth" });

        }

        function deleteLibrarian(id) {

            if (confirm(`Are you sure you want to delete librarian ID "${id}"?`)) {
                const res = window.DB.deleteLibrarian(id);
                displayLibrarians();
                clearForm();
                alert(res.message);
            }

        }

        function searchLibrarian() {

            let search = document.getElementById("search").value.toLowerCase();
            let rows = document.querySelectorAll("#tableBody tr");

            rows.forEach(row => {
                row.style.display = row.innerText.toLowerCase().includes(search) ? "" : "none";
            });

        }

        function clearForm() {

            document.getElementById("lid").value = "";
            document.getElementById("name").value = "";
            document.getElementById("email").value = "";
            document.getElementById("phone").value = "";
            document.getElementById("address").value = "";
            document.getElementById("password").value = "";
            document.getElementById("password").placeholder = "Password";
            document.getElementById("btnSaveLibrarian").innerText = "Add Librarian";
            editingLibrarianId = null;

        }

        document.addEventListener("DOMContentLoaded", displayLibrarians);

    </script>

</body>

</html>
