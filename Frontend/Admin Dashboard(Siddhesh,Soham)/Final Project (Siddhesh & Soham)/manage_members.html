<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Members</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<!-- Custom Theme CSS -->
<link rel="stylesheet" href="css/style.css">


<script src="js/auth.js"></script>
</head>

<body>

<div class="sidebar">
<h3>Library Admin</h3>

<a href="admin_page.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
<a href="manage_librarians.html"><i class="bi bi-person-workspace"></i> Manage Librarians</a>
<a href="manage_books.html"><i class="bi bi-book"></i> Manage Books</a>
<a href="manage_members.html"><i class="bi bi-people"></i> Manage Members</a>
<a href="reports.html"><i class="bi bi-file-earmark-bar-graph"></i> Reports</a>
<a href="fine_collection.html"><i class="bi bi-cash-stack"></i> Fine Collection</a>
<a href="backup.html"><i class="bi bi-database"></i> Backup Database</a>
<a href="logout.html"><i class="bi bi-box-arrow-right"></i> Logout</a>
</div>

<header>
    <i class="bi bi-people-fill"></i> Manage Members
</header>


<div class="container">

<div class="card">

<h2 id="formTitle">Add New Member</h2>

<form id="memberForm">

<input type="text" id="memberId" placeholder="Member ID (e.g. MEM001)">

<input type="text" id="name" placeholder="Full Name">

<input type="email" id="email" placeholder="Email Address">

<input type="text" id="phone" placeholder="Phone Number">

<input type="text" id="department" placeholder="Department">

<select id="type">
<option value="Student">Student</option>
<option value="Faculty">Faculty</option>
<option value="Staff">Staff</option>
</select>


<button type="button" class="add" id="btnSaveMember" onclick="saveMember()">
    Add Member
</button>

</form>

</div>

<div class="card">

<h2>Member List</h2>

<input
type="text"
class="search"
id="search"
placeholder="Search Member by ID, Name, Email, Phone, or Department..."
onkeyup="searchMember()">

<table id="memberTable">

<thead>

<tr>
<th>Member ID</th>
<th>Name</th>
<th>Email</th>
<th>Phone</th>
<th>Department</th>
<th>Type</th>
<th>Action</th>
</tr>

</thead>

<tbody id="memberTableBody">
</tbody>

</table>

</div>

</div>

<script>

const API = "http://localhost:5000/api/members";

function getToken() {
    return sessionStorage.getItem("token");
}

let editingMemberId = null;

async function loadMembers() {

    try {

        const response = await fetch(API, {
            headers: {
                Authorization: `Bearer ${getToken()}`
            }
        });

        const data = await response.json();

        if (!data.success) {
            alert(data.message);
            return;
        }

        const tbody = document.getElementById("memberTableBody");
        tbody.innerHTML = "";

        data.members.forEach(member => {

            const row = tbody.insertRow();

            row.innerHTML = `
                <td>${member.id}</td>
                <td>${member.name}</td>
                <td>${member.email}</td>
                <td>${member.phone}</td>
                <td>${member.department ?? "-"}</td>
                <td>${member.type}</td>

                <td>

                    <button class="edit"
                    onclick="editMember('${member.id}')">
                    Update
                    </button>

                    <button class="delete"
                    onclick="deleteMember('${member.id}')">
                    Delete
                    </button>

                </td>
            `;

        });

    } catch (err) {

        console.error(err);

        alert("Unable to load members.");

    }

}

async function saveMember() {

    const member = {
        id: document.getElementById("memberId").value,
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        phone: document.getElementById("phone").value,
        department: document.getElementById("department").value,
        type: document.getElementById("type").value
    };

    try {

        let response;

        if (editingMemberId) {

            response = await fetch(`${API}/${editingMemberId}`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                    Authorization: `Bearer ${getToken()}`
                },
                body: JSON.stringify(member)
            });

        } else {

            response = await fetch(API, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    Authorization: `Bearer ${getToken()}`
                },
                body: JSON.stringify(member)
            });

        }

        const data = await response.json();

        alert(data.message);

        if (data.success) {
            loadMembers();
            clearForm();
        }

    } catch (err) {

        console.error(err);
        alert("Unable to save member.");

    }

}

async function editMember(id) {

    try {

        const response = await fetch(API, {
            headers: {
                Authorization: `Bearer ${getToken()}`
            }
        });

        const data = await response.json();

        if (!data.success) {
            alert(data.message);
            return;
        }

        const m = data.members.find(member => member.id === id);

        if (!m) return;

        editingMemberId = m.id;

        document.getElementById("memberId").value = m.id;
        document.getElementById("name").value = m.name;
        document.getElementById("email").value = m.email;
        document.getElementById("phone").value = m.phone;
        document.getElementById("department").value = m.department || "";
        document.getElementById("type").value = m.type;

        document.getElementById("formTitle").innerText = "Edit Member";
        document.getElementById("btnSaveMember").innerHTML =
            `<i class="fa-solid fa-user-check me-1"></i> Update Member`;

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    } catch (err) {

        console.error(err);
        alert("Unable to load member.");

    }

}

async function deleteMember(id) {

    if (!confirm(`Are you sure you want to delete member ID "${id}"?`)) {
        return;
    }

    try {

        const response = await fetch(`${API}/${id}`, {
            method: "DELETE",
            headers: {
                Authorization: `Bearer ${getToken()}`
            }
        });

        const data = await response.json();

        alert(data.message);

        if (data.success) {
            loadMembers();
            clearForm();
        }

    } catch (err) {

        console.error(err);
        alert("Unable to delete member.");

    }

}

function searchMember(){

    let input = document.getElementById("search").value.toUpperCase();
    let rows = document.querySelectorAll("#memberTable tbody tr");

    rows.forEach(row => {
        row.style.display = (row.innerText.toUpperCase().indexOf(input) > -1) ? "" : "none";
    });

}

function clearForm() {

    document.getElementById("memberId").value = "";
    document.getElementById("name").value = "";
    document.getElementById("email").value = "";
    document.getElementById("phone").value = "";
    document.getElementById("department").value = "";
    document.getElementById("type").value = "Student";

    document.getElementById("formTitle").innerText = "Add New Member";
    document.getElementById("btnSaveMember").innerHTML = `<i class="fa-solid fa-user-plus me-1"></i> Add Member`;

    editingMemberId = null;

}

document.addEventListener("DOMContentLoaded", loadMembers);

</script>

</body>
</html>
