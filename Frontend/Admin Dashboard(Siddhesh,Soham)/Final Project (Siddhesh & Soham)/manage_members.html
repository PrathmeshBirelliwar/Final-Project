<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Members</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<!-- Custom Theme CSS -->
<link rel="stylesheet" href="css/style.css">

<script src="js/db.js"></script>
<script src="js/auth.js"></script>
</head>

<body>

<div class="sidebar">
<h3>Library Admin</h3>

<a href="admin_page.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
<a href="manage_librarians.html"><i class="bi bi-person-workspace"></i> Manage Librarians</a>
<a href="manage_books.html"><i class="bi bi-book"></i> Manage Books</a>
<a href="manage_members.html"><i class="bi bi-people"></i> Manage Members</a>
<a href="reports.html"><i class="bi bi-file-earmark-bar-graph"></i> Reports</a>
<a href="fine_collection.html"><i class="bi bi-cash-stack"></i> Fine Collection</a>
<a href="backup.html"><i class="bi bi-database"></i> Backup Database</a>
<a href="logout.html"><i class="bi bi-box-arrow-right"></i> Logout</a>
</div>

<header>
    <i class="bi bi-people-fill"></i> Manage Members
</header>


<div class="container">

<div class="card">

<h2 id="formTitle">Add New Member</h2>

<form id="memberForm">

<input type="text" id="memberId" placeholder="Member ID (e.g. MEM001)">

<input type="text" id="name" placeholder="Full Name">

<input type="email" id="email" placeholder="Email Address">

<input type="text" id="phone" placeholder="Phone Number">

<input type="text" id="department" placeholder="Department">

<select id="type">
<option value="Student">Student</option>
<option value="Faculty">Faculty</option>
<option value="Staff">Staff</option>
</select>


<button type="button" class="add" id="btnSaveMember" onclick="saveMember()">
    Add Member
</button>

</form>

</div>

<div class="card">

<h2>Member List</h2>

<input
type="text"
class="search"
id="search"
placeholder="Search Member by ID, Name, Email, Phone, or Department..."
onkeyup="searchMember()">

<table id="memberTable">

<thead>

<tr>
<th>Member ID</th>
<th>Name</th>
<th>Email</th>
<th>Phone</th>
<th>Department</th>
<th>Type</th>
<th>Action</th>
</tr>

</thead>

<tbody id="memberTableBody">
</tbody>

</table>

</div>

</div>

<script>

let editingMemberId = null;

function loadMembers() {
    const members = window.DB.getMembers();
    const tbody = document.getElementById("memberTableBody");
    tbody.innerHTML = "";

    members.forEach(member => {
        const row = tbody.insertRow();
        row.innerHTML = `
            <td>${member.id}</td>
            <td>${member.name}</td>
            <td>${member.email}</td>
            <td>${member.phone}</td>
            <td>${member.department || '-'}</td>
            <td>${member.type}</td>
            <td>
                <button class="edit" onclick="editMember('${member.id}')">
                    Update
                </button>

                <button class="delete" onclick="deleteMember('${member.id}')">
                    Delete
                </button>
            </td>
        `;
    });
}

function saveMember(){

    const id = document.getElementById("memberId").value;
    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const phone = document.getElementById("phone").value;
    const department = document.getElementById("department").value;
    const type = document.getElementById("type").value;

    let res;
    if (editingMemberId) {
        // Edit Mode
        res = window.DB.updateMember(editingMemberId, { id, name, email, phone, department, type });
    } else {
        // Add Mode: Unique Member ID check (BUG_13) & Strong Validation (BUG_14)
        res = window.DB.addMember({ id, name, email, phone, department, type });
    }

    if (!res.success) {
        alert(res.message);
        return;
    }

    loadMembers();
    clearForm();
    alert(res.message);

}

function editMember(id){

    const members = window.DB.getMembers();
    const m = members.find(item => item.id.toLowerCase() === id.toLowerCase());

    if (!m) return;

    editingMemberId = m.id;

    document.getElementById("memberId").value = m.id;
    document.getElementById("name").value = m.name;
    document.getElementById("email").value = m.email;
    document.getElementById("phone").value = m.phone;
    document.getElementById("department").value = m.department || "";
    document.getElementById("type").value = m.type || "Student";

    document.getElementById("formTitle").innerText = "Edit Member";
    document.getElementById("btnSaveMember").innerHTML = `<i class="fa-solid fa-user-check me-1"></i> Update Member`;

    window.scrollTo({ top: 0, behavior: "smooth" });

}

function deleteMember(id){

    if(confirm(`Are you sure you want to delete member ID "${id}"?`)){
        const res = window.DB.deleteMember(id);
        loadMembers();
        clearForm();
        alert(res.message);
    }

}

function searchMember(){

    let input = document.getElementById("search").value.toUpperCase();
    let rows = document.querySelectorAll("#memberTable tbody tr");

    rows.forEach(row => {
        row.style.display = (row.innerText.toUpperCase().indexOf(input) > -1) ? "" : "none";
    });

}

function clearForm() {

    document.getElementById("memberId").value = "";
    document.getElementById("name").value = "";
    document.getElementById("email").value = "";
    document.getElementById("phone").value = "";
    document.getElementById("department").value = "";
    document.getElementById("type").value = "Student";

    document.getElementById("formTitle").innerText = "Add New Member";
    document.getElementById("btnSaveMember").innerHTML = `<i class="fa-solid fa-user-plus me-1"></i> Add Member`;

    editingMemberId = null;

}

document.addEventListener("DOMContentLoaded", loadMembers);

</script>

</body>
</html>
