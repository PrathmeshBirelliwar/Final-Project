<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/library-store.js"></script>
    <script>
        // This used to be a second, unwired copy of the dashboard with static
        // placeholder data. The real dashboard lives at pages/dashboard.html
        // and is fully wired to the live backend, so this just routes there.
        window.location.replace(
            window.LibraryStore && window.LibraryStore.isLoggedIn()
                ? "pages/dashboard.html"
                : "login.html"
        );
    </script>
</head>
<body>
    <p>Redirecting&hellip;</p>
</body>
</html>
