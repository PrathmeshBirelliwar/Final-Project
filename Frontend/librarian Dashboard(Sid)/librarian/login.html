<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>LibraryMS Login</title>

    <!-- Google Font -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->

    <link rel="stylesheet"
          href="css/login.css">

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="login-header">

            <i class="fa-solid fa-book-open-reader"></i>

            <h1>LibraryMS</h1>

            <p>

                Welcome Back

            </p>

        </div>

        <form id="loginForm">

            <div class="form-group">

                <label>

                    Username

                </label>

                <input

                    type="text"

                    id="username"

                    placeholder="Enter username"

                    required>

            </div>

            <div class="form-group">

                <label>

                    Password

                </label>

                <div class="password-box">

                    <input

                        type="password"

                        id="password"

                        placeholder="Enter password"

                        required>

                    <button

                        type="button"

                        id="togglePassword">

                        <i class="fa-solid fa-eye"></i>

                    </button>

                </div>

            </div>

            <div class="remember-row">

    <label>

        <input
            type="checkbox"
            id="rememberMe">

        Remember Me

    </label>

    <a href="#"

       id="forgotPassword">

        Forgot Password?

    </a>

</div>         <button

                type="submit"

                class="login-btn">

                <i class="fa-solid fa-right-to-bracket"></i>

                Login

            </button>

            <p

                id="loginError"

                class="error-message">

            </p>

        </form>

        <div class="login-footer">

            © 2026 Library Management System

        </div>

    </div>

</div>
<!-- ========================================= -->
<!-- FORGOT PASSWORD MODAL -->
<!-- ========================================= -->

<div class="modal-overlay"

     id="forgotModal">

    <div class="profile-modal">

        <div class="modal-header">

            <h2>

                Reset Password

            </h2>

            <button id="closeForgotModal">

                ×

            </button>

        </div>

        <div class="form-group">

            <label>

                New Password

            </label>

            <input

                type="password"

                id="newPassword">

        </div>

        <div class="form-group">

            <label>

                Confirm Password

            </label>

            <input

                type="password"

                id="confirmPassword">

        </div>

        <button

            id="savePassword"

            class="login-btn">

            Save Password

        </button>

    </div>

</div>

<!-- ========================================= -->
<!-- JAVASCRIPT -->
<!-- ========================================= -->

<script src="js/login.js"></script>

</body>

</html>
