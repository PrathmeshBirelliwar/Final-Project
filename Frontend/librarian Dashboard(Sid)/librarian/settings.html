<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Settings</title>

    <!-- Google Font -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->

    <link rel="stylesheet"
          href="css/style.css">

    <link rel="stylesheet"
          href="css/settings.css">

</head>

<body>

<div class="dashboard-wrapper">

<!-- ========================================= -->
<!-- SIDEBAR -->
<!-- ========================================= -->

<aside class="sidebar">

    <div class="sidebar-logo">

        <i class="fa-solid fa-book-open-reader"></i>

        <h2>LibraryMS</h2>

    </div>

    <nav class="sidebar-nav">

        <ul>

            <li><a href="index.html"><i class="fa-solid fa-house"></i><span>Dashboard</span></a></li>

            <li><a href="books.html"><i class="fa-solid fa-book"></i><span>Books</span></a></li>

            <li><a href="students.html"><i class="fa-solid fa-users"></i><span>Students</span></a></li>

            <li><a href="issue-book.html"><i class="fa-solid fa-arrow-right-arrow-left"></i><span>Issue Book</span></a></li>

            <li><a href="return-book.html"><i class="fa-solid fa-rotate-left"></i><span>Return Book</span></a></li>

            <li><a href="fine.html"><i class="fa-solid fa-money-bill-wave"></i><span>Fine</span></a></li>

            <li><a href="reports.html"><i class="fa-solid fa-chart-column"></i><span>Reports</span></a></li>

            <li class="active">

                <a href="settings.html">

                    <i class="fa-solid fa-gear"></i>

                    <span>Settings</span>

                </a>

            </li>

        </ul>

    </nav>

</aside>

<!-- ========================================= -->
<!-- MAIN CONTENT -->
<!-- ========================================= -->

<main class="main-content">

<header class="top-header">

    <div>

        <h1>Settings</h1>

        <p>

            Configure your library management system.

        </p>

    </div>

</header>

<!-- ========================================= -->
<!-- LIBRARY SETTINGS -->
<!-- ========================================= -->

<section class="settings-card">

    <h2>

        <i class="fa-solid fa-building"></i>

        Library Information

    </h2>

    <div class="settings-grid">

        <div class="form-group">

            <label>Library Name</label>

            <input
                type="text"
                id="libraryName">

        </div>

        <div class="form-group">

            <label>Library Address</label>

            <input
                type="text"
                id="libraryAddress">

        </div>

        <div class="form-group">

            <label>Contact Number</label>

            <input
                type="text"
                id="libraryContact">

        </div>

        <div class="form-group">

            <label>Email</label>

            <input
                type="email"
                id="libraryEmail">

        </div>

    </div>

</section>

<!-- ========================================= -->
<!-- BOOK SETTINGS -->
<!-- ========================================= -->

<section class="settings-card">

    <h2>

        <i class="fa-solid fa-book"></i>

        Book Settings

    </h2>

    <div class="settings-grid">

        <div class="form-group">

            <label>

                Maximum Books Per Student

            </label>

            <input

                type="number"

                id="maxBooks"

                min="1">

        </div>

        <div class="form-group">

            <label>

                Loan Duration (Days)

            </label>

            <input

                type="number"

                id="loanDays"

                min="1">

        </div>

    </div>

</section>

<!-- ========================================= -->
<!-- FINE SETTINGS -->
<!-- ========================================= -->

<section class="settings-card">

    <h2>

        <i class="fa-solid fa-money-bill-wave"></i>

        Fine Settings

    </h2>

    <div class="settings-grid">

        <div class="form-group">

            <label>

                Fine Per Day (₹)

            </label>

            <input

                type="number"

                id="finePerDay"

                min="0">

        </div>

    </div>

</section>

<!-- ========================================= -->
<!-- SYSTEM SETTINGS -->
<!-- ========================================= -->

<section class="settings-card">

    <h2>

        <i class="fa-solid fa-sliders"></i>

        System Settings

    </h2>

    <div class="settings-buttons">

        <button

            id="saveSettings"

            class="save-btn">

            <i class="fa-solid fa-floppy-disk"></i>

            Save Settings

        </button>

        <button

            id="resetSettings"

            class="reset-btn">

            <i class="fa-solid fa-rotate-left"></i>

            Restore Default

        </button>

        <button

            id="clearDatabase"

            class="delete-btn">

            <i class="fa-solid fa-trash"></i>

            Clear All Data

        </button>

    </div>

</section>

<!-- ========================================= -->
<!-- BOOTSTRAP -->
<!-- ========================================= -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<!-- ========================================= -->
<!-- SHARED DATABASE -->
<!-- ========================================= -->

<script src="data/library-data.js"></script>

<!-- ========================================= -->
<!-- SETTINGS JAVASCRIPT -->
<!-- ========================================= -->

<script src="js/settings.js"></script>

</main>

</div>

</body>

</html>
