<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reports</title>

    <!-- Google Font -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->

    <link rel="stylesheet"
          href="css/style.css">

    <link rel="stylesheet"
          href="css/reports.css">

</head>

<body>

<div class="dashboard-wrapper">

<!-- ========================================= -->
<!-- SIDEBAR -->
<!-- ========================================= -->

<aside class="sidebar">

    <div class="sidebar-logo">

        <i class="fa-solid fa-book-open-reader"></i>

        <h2>LibraryMS</h2>

    </div>

    <nav class="sidebar-nav">

        <ul>

            <li>

                <a href="index.html">

                    <i class="fa-solid fa-house"></i>

                    <span>Dashboard</span>

                </a>

            </li>

            <li>

                <a href="books.html">

                    <i class="fa-solid fa-book"></i>

                    <span>Books</span>

                </a>

            </li>

            <li>

                <a href="students.html">

                    <i class="fa-solid fa-users"></i>

                    <span>Students</span>

                </a>

            </li>

            <li>

                <a href="issue-book.html">

                    <i class="fa-solid fa-arrow-right-arrow-left"></i>

                    <span>Issue Book</span>

                </a>

            </li>

            <li>

                <a href="return-book.html">

                    <i class="fa-solid fa-rotate-left"></i>

                    <span>Return Book</span>

                </a>

            </li>

            <li>

                <a href="fine.html">

                    <i class="fa-solid fa-money-bill-wave"></i>

                    <span>Fine</span>

                </a>

            </li>

            <li class="active">

                <a href="reports.html">

                    <i class="fa-solid fa-chart-column"></i>

                    <span>Reports</span>

                </a>

            </li>

            <li>

                <a href="settings.html">

                    <i class="fa-solid fa-gear"></i>

                    <span>Settings</span>

                </a>

            </li>

        </ul>

    </nav>

</aside>

<!-- ========================================= -->
<!-- MAIN CONTENT -->
<!-- ========================================= -->

<main class="main-content">

<header class="top-header">

    <div>

        <h1>Reports</h1>

        <p>

            View library reports and statistics.

        </p>

    </div>

</header>

<!-- ========================================= -->
<!-- REPORT CARDS -->
<!-- ========================================= -->

<section class="report-cards">

    <div class="report-card">

        <i class="fa-solid fa-book"></i>

        <h2 id="reportBooks">0</h2>

        <p>Total Books</p>

    </div>

    <div class="report-card">

        <i class="fa-solid fa-users"></i>

        <h2 id="reportStudents">0</h2>

        <p>Total Students</p>

    </div>

    <div class="report-card">

        <i class="fa-solid fa-book-open"></i>

        <h2 id="reportIssued">0</h2>

        <p>Issued Books</p>

    </div>

    <div class="report-card">

        <i class="fa-solid fa-money-bill-wave"></i>

        <h2 id="reportFine">₹0</h2>

        <p>Total Fine</p>

    </div>

</section>

<!-- ========================================= -->
<!-- SEARCH & FILTER -->
<!-- ========================================= -->

<section class="report-toolbar">

    <div class="search-box">

        <i class="fa-solid fa-magnifying-glass"></i>

        <input
            type="text"
            id="searchReport"
            placeholder="Search reports...">

    </div>

    <div class="filter-box">

        <select id="reportType">

            <option value="books">

                Books Report

            </option>

            <option value="students">

                Students Report

            </option>

            <option value="issued">

                Issued Books

            </option>

            <option value="returned">

                Returned Books

            </option>

            <option value="fines">

                Fine Report

            </option>

        </select>

    </div>

</section>

<!-- ========================================= -->
<!-- EXPORT BUTTONS -->
<!-- ========================================= -->

<section class="report-actions">

    <button id="printReport" class="action-btn">

        <i class="fa-solid fa-print"></i>

        Print

    </button>

    <button id="pdfReport" class="action-btn">

        <i class="fa-solid fa-file-pdf"></i>

        Export PDF

    </button>

    <button id="excelReport" class="action-btn">

        <i class="fa-solid fa-file-excel"></i>

        Export Excel

    </button>

</section>

<!-- ========================================= -->
<!-- REPORT TABLE -->
<!-- ========================================= -->

<section class="report-table-section">

    <div class="table-header">

        <h2 id="reportTitle">

            Books Report

        </h2>

    </div>

    <table class="report-table">

        <thead id="reportHead">

        </thead>

        <tbody id="reportBody">

        </tbody>

    </table>

</section>

<!-- ========================================= -->
<!-- BOOTSTRAP -->
<!-- ========================================= -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<!-- ========================================= -->
<!-- SHARED DATABASE -->
<!-- ========================================= -->

<script src="data/library-data.js"></script>

<!-- ========================================= -->
<!-- REPORT JAVASCRIPT -->
<!-- ========================================= -->

<script src="js/reports.js"></script>

</main>

</div>

</body>

</html>
